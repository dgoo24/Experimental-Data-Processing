services:
  db:
    image: postgres:16
    container_name: experimental_data_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: experimental_data
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d experimental_data"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
